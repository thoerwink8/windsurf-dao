name: dao-check

# 2026-08-22 省量改造（Actions 免费额度 8-22 被烧穿：本月 923 run、check.yml 557 次
# Windows 2 倍率 ≈ 2200 计费分钟，超出免费 2000 分钟）：
#   1. windows-latest → ubuntu-latest：计费倍率 2x → 1x，同样分钟数直接减半。
#      仓内脚本全是跨平台 Node；Windows 专属行为（conhost hook 等）的验证回归
#      换机时人工，CI 不再承担「验 Windows 装机文档」的 fidelity。
#   2. push master 触发 → 每日 cron：#567 的保护（master 带病不能无人报警）保留，
#      但从「每次推 master 都跑」降为「每天对 master 跑一次」+ PR 闸不变。
#      每个合并从 2 run 降为 1 run。
#   3. concurrency 同 ref 取消在途旧 run：连续 push 不再排队烧分钟。
#
# GH_TOKEN 口径（#567，必须显式选一种并注明理由，不能默认沉默）：给。
#   1. ⑭ open 单数量阈值靠 gh issue list——不给 token 它在 CI 永远 SKIP（SKIP 是
#      「没查成」的显式标记，不是绿），一个核心检查永远没查成，等于这个闸不存在。
#   2. 先例：blocked-notify.yml 的 GH_TOKEN: ${{ github.token }} 同款用法。
# 权限按最小化给：checkout 要 contents: read，gh issue list 要 issues: read。

on:
  pull_request:
  schedule:
    - cron: '0 1 * * *'   # 每日 09:00（UTC+8）对 master 跑一次，接替 #567 的 push 触发
  workflow_dispatch:

concurrency:
  group: dao-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 选型 CLI 读 origin/master 的模型路由（issue #533），浅克隆没有这个 ref，必须全量。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # dao check 第 ⑦ 项验的是「自带 hook 的 skill 在这台机器上装没装、还跑不跑得动」，
      # 干净 runner 上当然没装。所以这里按 NEW-MACHINE.md 第 12 节的装法语义真装一遍
      # （Linux 等价：ln -s，建不了链接退拷贝）——顺带让每个 PR 都验一次装载语义还灵不灵。
      - name: 装自带 hook 的 skill（Linux 等价装法）
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.claude/skills"
          for d in host/skills/*/; do
            if [ -f "$d/hooks/hooks.json" ]; then
              name=$(basename "$d")
              link="$HOME/.claude/skills/$name"
              if ln -sfn "$GITHUB_WORKSPACE/${d%/}" "$link" 2>/dev/null; then
                echo "linked  $link -> $GITHUB_WORKSPACE/${d%/}"
              else
                cp -r "$d" "$link"
                echo "copied  $link （这台机器建不了符号链接）"
              fi
            fi
          done

      # 显式 `--all-tests`：CI 是那道全量的网，不许依赖「碰巧没有地图所以退全量」这种隐含行为。
      # 2026-09-06 dao-check 的默认档从全量翻成裁剪；CI 这条当时**不加旗标也仍是全量**
      # （全新 clone 没有影响地图 ⇒ affectedTests 直接回 full），但那是涌现出来的正确，
      # 不是写下来的意图——地图哪天进了缓存，CI 就会在没人察觉的情况下开始裁剪。
      #
      # 为什么不用 `--full`：它还会打开 7 项探网检查，那些至今没在 CI 跑过。
      # 本次改的是「跑哪些测试」，顺手把 CI 的检查面也扩一倍是另一件事，不混进来。
      - run: node scripts/dao-check.mjs --all-tests
        env:
          # #567：不给 token 时 gh 在 Actions 里必报「set the GH_TOKEN environment variable」，
          # ⑭ open 单数量阈值会一直 SKIP（没查成，不是绿）。
          GH_TOKEN: ${{ github.token }}

      # 影响地图（TIA）不进 git，是每台机器自己的派生数据 ⇒ CI 这里没有地图，也不需要有。
      # 它现在是 dao-check 跑测试的副产物，没有建图动作、没有健康闸、没有漂移比对。
