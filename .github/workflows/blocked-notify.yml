name: blocked-notify

# issue #526：前置解除的那一刻有东西主动出声。
# 关闭一张 issue / 合并一张 PR 后，搜所有 open issue 和 open PR 里写
# `Blocked-by: #<刚关的号>` 的，给每一张发评论提醒「请先确认这单还成不成立」——
# 输出是提醒不是自动开工。
#
# #544（本单修的两个毛病）：
#   - GH_TOKEN：gh 在 Actions 环境不自动拿 token，必须显式给 github.token，
#     否则每次触发都 ::error:: + 非 0 退出（runs 31910793769/31910793469）。
#   - 触发面：前置常常是 PR，合并 PR 不触发 issues: closed（真实损失：#539 等
#     #519 无人提醒），所以加 pull_request: types: [closed]，NUMBER 同时认
#     github.event.issue.number 与 github.event.pull_request.number；
#     pull-requests: write 是 PR 搜索面（gh pr list）需要的读/写权限——
#     #544 原文「issues: write 够用」只对 issue 面成立，PR 面进来后不够。
#
# 口径（#532）：搜索失败与「搜到 0 条」分开，失败在日志里 ::error:: 报红、非 0 退出，
# 绝不静默当成「没人等」。
#
# 注意：issues 事件只认默认分支（master）上的 workflow，合并前 issues 触发面验不了；
# pull_request 事件按 merge commit 版本跑——合并本 PR 自己就是第一次 PR close 真触发
# （验收样本见 PR 正文：合并后应评论「Blocked-by: #本PR」的样本 issue）。
# 手工补测走 workflow_dispatch（填 issue_number，issue 或 PR 号都行），或本地跑
#   node scripts/notify-blocked.mjs <关掉的号>
# （验收的构造样本 == 一次 dispatch + 真实 comment 落账，见 PR 描述）。

on:
  issues:
    types: [closed]
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 手动补测：查谁的等待者（issues/pull_request 触发不了或要补验时用；issue 或 PR 号都行）
        required: false
        type: string
        default: ""

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 前置解除提醒（#526 #544）
        run: node scripts/notify-blocked.mjs "$NUMBER"
        env:
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || github.event.inputs.issue_number }}
          GH_TOKEN: ${{ github.token }}