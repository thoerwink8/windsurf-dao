# canonical issue 模板 · 真相源在 windsurf-dao ccswitch/templates/ISSUE_TEMPLATE/。
# 项目 .github/ISSUE_TEMPLATE/bug.yml 从此派生（下沉时可加项目特有槽位，如「哪个平台/哪个版本」）。
# 原则与 pull_request_template.md 同源：给人读的 —— 上半段说人话按 STAR 填，
# 技术证据放折叠段，人扫顶部一眼懂、AI 展开读全部零丢失。
#
# ⚠ 收益边界（照直写，别以为建了模板就全覆盖了）：GitHub issue forms **只作用于**
#   ①网页开单 ②`gh issue create --template bug.yml`。AI 用 `gh issue create -t -b -l`
#   建单**走不到这里**，那条路的分层结构靠 dao.md「工作项三态归位」条款约束，不靠本文件。
#   所以本模板的读者主要是**人**（用户自己开单，或未来的协作者）。

name: 🐞 缺陷
description: 有东西坏了 / 行为与预期不符
labels: ["缺陷"]
body:
  - type: markdown
    attributes:
      value: |
        **先说人话，证据放折叠段。** 一个没参与这个项目的人扫一眼顶部，
        应该就知道发生了什么 —— 展开黑话才懂就是没说人话。

  - type: textarea
    id: symptom
    attributes:
      label: 撞到了什么（一两句人话）
      description: 你在做什么的时候、看到了什么。像跟同事描述，不要先写结论。
      placeholder: 我在 X 界面点了 Y，本来以为会 Z，结果它什么都没发生。
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 怎么复现
      description: 逐步写。**复现不了也要写**——写清「试了什么、什么条件下出现过一次」，那同样是信息。
      placeholder: |
        1. 打开 …
        2. 点击 …
        3. 观察到 …

        复现率：3 次里 3 次 / 只见过一次，之后再没复现
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: 期望 vs 实际
      description: 两行就够。**「期望」写出来很重要**——很多单最后发现分歧在这一行，不在代码。
      placeholder: |
        期望：…
        实际：…
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 技术证据（可选，展开给复核 / AI 看）
      description: 日志、报错、退出码、截图链接、相关文件行号。**一个字不删**，折叠起来即可。
      placeholder: |
        <details>
        <summary>技术证据</summary>

        报错原文 / 退出码 / 相关文件:行号 / 版本号 …

        </details>
    validations:
      required: false

  - type: checkboxes
    id: pre-checks
    attributes:
      label: 开单前
      options:
        - label: 搜过 open issue，这不是已有单的重复
          required: false
        - label: 「期望」那一行写的是我真正想要的行为，不是我猜的实现方式
          required: false
