# canonical issue 模板（历史真相源已随拆旧删除，本件即为现行版）
# 项目 .github/ISSUE_TEMPLATE/debt.yml 从此派生。收益边界见同目录 bug.yml 抬头注释。

name: 🧾 欠账
description: 当时该做但没做的事（降级挂账 / 验证没跑完 / 半截改造）
labels: ["欠账"]
body:
  - type: markdown
    attributes:
      value: |
        **这张单存在的唯一理由是：让一笔义务在转移的时候不蒸发。**
        「随后补」「下批处理」写在文本里，转移方当场就获得了心理结算，
        而接收方的责任面上从来没有这一项 —— 于是它在转移那一刻消失。
        带编号的账目是转移的唯一合法形态。**最承重的一栏是「解冻条件」**：
        答不出「什么时候能做」的欠账，下一个人扫到它也只能再放回去。

  - type: textarea
    id: owed
    attributes:
      label: 本来该做什么
      description: 一句人话说清欠的是什么。别写「验证不充分」这种——写「X 这条路径没在真机上跑过」。
      placeholder: PR #NNN 改了 X，但 X 只有单测覆盖，真机上那条路径一次都没走过。
    validations:
      required: true

  - type: textarea
    id: why-not
    attributes:
      label: 当时为什么没做
      description: |
        照直写。**「懒」也是合法答案**，但更常见的是结构性原因（资源被占、环境起不来、
        依赖另一件事没落地）——那类原因才有解冻条件可写。
      placeholder: 走查要独占那台设备，同批有三路在抢，本路让了。
    validations:
      required: true

  - type: textarea
    id: unblock
    attributes:
      label: 解冻条件（满足什么就能做了）
      description: |
        **必填，且要能被指认。** 「有空了」不算解冻条件；「#NNN 合并后」「拿到设备名额」
        「那个变量落地后」才算。真的判定为**永远做不了**，就写清「判为不可行 + 理由」，
        然后关掉它 —— 那也是一种清偿，比无限期挂着诚实。
      placeholder: |
        - #NNN 合并后即可（它提供了本单需要的隔离面）
        - 或：下一次拿到设备名额时，跑 A/B/C 三条路径
    validations:
      required: true

  - type: input
    id: origin
    attributes:
      label: 从哪来的（PR / issue / 提交）
      description: 这笔账是在哪一次动作里产生的。留空也行，但填了能省下一次考古。
      placeholder: "#NNN / commit abc1234"
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: 技术证据 / 已做到哪一步（可选，折叠）
      description: 已跑过什么、跑到哪红了、当时的退出码与输出。**已完成的部分要写**，避免下一个人从零重来。
      placeholder: |
        <details>
        <summary>已做到哪一步</summary>

        单测：`…` 退出码 0（覆盖 A、B 两态）
        未跑：真机 C 路径 —— 需要 …

        </details>
    validations:
      required: false

  - type: checkboxes
    id: pre-checks
    attributes:
      label: 开单前
      options:
        - label: 解冻条件是可指认的事件，不是「有空了」
          required: false
        - label: 这笔账在它产生的那个 PR / 交付里留了指向本单编号的指针（否则两边对不上）
          required: false
