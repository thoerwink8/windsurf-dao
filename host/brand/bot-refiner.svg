<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="dao-refiner">
  <title>dao-refiner</title>
  <!-- 家族规矩（见 host/brand/README.md）：
       纯色底 + 一个白色扁平图形，无渐变、无描边、无外框，底色取 GitHub Primer。
         marshal #bc4c00 三角 · worker #1a7f37 方块 · reviewer #0d419d 对勾
         watchdog #8250df 狗头 · refiner #bf3989 分流叉
       底色选 pink-500：与橙/绿/蓝/紫四只都拉得开，缩略图里不会认错人。

       图形是「一进两出」的分叉，正是消歧官的职责：一张生单进来，判完分两路
       （无岔路的进派单队列 / 有岔路的升级给人拍板）。

       正立的 Y 会被读成字母（家族规矩写着「无文字」），所以倒过来：
       一股从顶上进来、往下分两路，语义也更对。第一版画成「分叉 + 两个端头方块」，30px 下三段全糊成一团（实渲染看过）。
       端头方块删掉之后才立住——小尺寸能活下来的只有轮廓，细节一律是负担。
       与 marshal 三角的区分：三角是实心块面，本图是线性笔画，30px 下轮廓不撞。

       三段刻意互相压过一截（不是首尾相接）：相接会在接缝处漏出底色，
       第一版就在分叉口漏出一个粉色的 X。改这张之前先渲染 30px 看一眼。 -->
  <rect width="200" height="200" fill="#bf3989"/>

  <g fill="#ffffff">
    <!-- 主干：从顶部进来的一股。末端探到 y=112，压进分叉口内部，消除接缝 -->
    <path d="M85 22 h30 v90 h-30 Z"/>
    <!-- 左支：分叉口 → 左下。butt 收口，末端斜切 -->
    <path d="M89.4 89.4 L110.6 110.6 L54.6 166.6 L33.4 145.4 Z"/>
    <!-- 右支：左支的镜像 -->
    <path d="M110.6 89.4 L89.4 110.6 L145.4 166.6 L166.6 145.4 Z"/>
  </g>
</svg>
