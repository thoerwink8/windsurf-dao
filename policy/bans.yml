# ============================================================================
# 点将台硬禁令 —— 政策层，人类独占写（设计 docs/dianjiangtai-design.md F1 / A.3）
# 禁令是门闩：命中即拒、不进打分，先于一切评分（数据不可侵蚀）。
# 匹配规则：bans 条目命中 (model, work_types?, identities?) —— models 必填，
# work_types / identities 为空或缺失 = 不限（(m,*) 全工种/全身份禁）。
# 自选（job.override）与尝鲜（job.explore）也不可绕过禁令；用户改禁令需改本文件。
# 事实来源：docs/model-routing.json 禁令（唯一真相），此处是它在点将台政策层的镜像。
# ============================================================================

