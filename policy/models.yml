# ============================================================================
# 点将台模型目录（registry）——政策层，人类独占写（设计 docs/dianjiangtai-design.md A.1/A.3）
# 事实来源：docs/model-routing.toml（路由真相源）与 issue #438 拍板。
# 价格单位：元/百万 tokens（DeepSeek 官方价目注记 2026-08-14 誊抄，见 model-routing.toml 末尾）。
# 美元折算：设计 B.2 要求全部折算美元，但 CNY→USD 汇率未拍板 → fx 待补；
# 未核价模型的 pricing.verified_at 为 null，选型对其成本记「价目待补」，不参与 min-max 极值。
# 加模型：先改这里，再（若涉及路由/禁令）同步 model-routing.toml。
# ============================================================================

updated: "2026-08-18"
currency: CNY
fx_usd_per_cny: null      # 待补：汇率拍板后填，并给 fx_verified_at 打时间戳
fx_verified_at: null

models:
  # ds-flash/pro 2026-08-16 起主通道走 opencode Go 额度池。同一个模型两条通道，
  # 条目仍只有一条——用户拍板「没区别，算法记录要互通」，拆两个 id 会把战绩记成两本账。
  # 应急直连价目（元/百万tokens）见 model-routing.toml 末尾「DeepSeek 价目注记」，
  # 那是切回直连时的参考；本处 pricing 记的是日常主通道（Go）的口径。
  - id: deepseek-v4-flash
    provider: opencode-go
    cli: pi --provider opencode-go
    version: DeepSeek-V4-Flash-0731
    context_window: 1000000
    max_output: 384000
    roles: [写码]
    status: 正式
    retired: false
    why: 写码类谷时主选；主通道 opencode-go，限流时切直连接着做（model-routing.toml）
    decided: "2026-08-16"
    pricing:
      verified_at: "2026-08-16"  # 「额度内边际成本≈0」已实测；月费是美元、fx 未拍板 → 摊销待补
      subscription:
        kind: 额度包月
        marginal_cost: 0
        monthly_fee: null        # $10/月（美元）。本文件 currency 是 CNY 且 fx 未拍板，填数会被当人民币参与摊销
        included_tokens: null    # Go 按美元额度计（非 token 额度），换算待补
        fair_share_jobs: null
      metered: null

  - id: deepseek-v4-pro
    provider: opencode-go
    cli: pi --provider opencode-go
    version: DeepSeek-V4-Pro-0813
