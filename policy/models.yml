  # 条目仍只有一条——用户拍板「没区别，算法记录要互通」，拆两个 id 会把战绩记成两本账。
  # og / 应急直连价目见 model-routing.toml，只在用户拍板切回时参考。
  - id: deepseek-v4-flash
    provider: gw
    cli: pi --model gw-dspool/deepseek-v4-flash
    version: DeepSeek-V4-Flash-0731
    context_window: 1000000
    max_output: 384000
    roles: [写码]
    status: 正式
    retired: false
    why: 写码 fallback；#822 通道 gw-dspool（前置2 工具样例绿）。og 在服务器 403，从选型移除
    decided: "2026-09-03"
    pricing:
      verified_at: "2026-08-16"  # 「额度内边际成本≈0」已实测；月费是美元、fx 未拍板 → 摊销待补
      subscription:
        kind: 额度包月
        marginal_cost: 0
        monthly_fee: null        # $10/月（美元）。本文件 currency 是 CNY 且 fx 未拍板，填数会被当人民币参与摊销
        included_tokens: null    # Go 按美元额度计（非 token 额度），换算待补
        fair_share_jobs: null
      metered: null

