# 高峰时段 = 北京时间 9:00–12:00、14:00–18:00；其余为空闲（谷）时段，空闲价 = 高峰价的一半。
# 新价自北京时间 2026-08-17 00:00 生效，单位：元 / 百万 tokens。
#
#   模型                时段            输入·缓存命中   输入·缓存未命中   输出
#   deepseek-v4-flash   空闲（谷）      0.05           1.5             4.5
#   deepseek-v4-flash   高峰（峰）      0.10           3.0             9.0
#   deepseek-v4-pro     空闲（谷）      0.15           4.5             13.5
#   deepseek-v4-pro     高峰（峰）      0.30           9.0             27.0
#
# 生效前现价：flash 0.02 / 1 / 2；pro 0.025 / 3 / 6（同为 元/百万 tokens）。
# 模型版本：DeepSeek-V4-Flash-0731、DeepSeek-V4-Pro-0813；上下文 1M，输出最大 384K。
