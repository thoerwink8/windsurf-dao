updated = "2026-08-17"

# ── provider：每个模型厂商的启动方式与坑 ──────────────────────────────────
# launch = 完整启动命令模板（issue #482）。脚本只读这一字段，禁止硬编码参数。
# {model} 用 --model / launch_model / default_model 替换；缺了 fail-loud。

[providers.deepseek]
cli = "pi"
default_model = "deepseek-v4-flash"   # 拍板 issue #462：pi 派单默认 flash（~/.pi/agent/settings.json 已手改，本字段固化）；ds-pro 仅限重型任务
launch = "pi --provider deepseek --model {model}"
launch_model = "deepseek-v4-flash"
launch_note = """
DeepSeek 系工人的 CLI。启动命令即 pi（npm 包 @mariozechner/pi-coding-agent，别装成 @mariozechner/pi）。
派单默认模型 deepseek-v4-flash（拍板 issue #462，本文件 [providers.deepseek].default_model 为固化点）。
峰谷计费 2026-08-17 北京时间 0 点生效，精确价目见文件末尾「DeepSeek 价目注记」。

2026-08-16 起本节降为**应急直连通道**：通道规则唯一落点见 [providers.opencode-go].why（2026-08-16 追加拍板）。
两条通道跑的是同一个模型，所以模型条目只有一条（战绩记在一处，不拆两本账）。

**-direct 止血（#569）与 cli_model 的限制**：本机 `~/.pi/agent/models-store.json` 的 deepseek provider
两条 model id 已加 `-direct` 后缀（deepseek-v4-flash-direct / deepseek-v4-pro-direct），断掉 pi 内置
「同 model id 找别的 provider」的静默 fallback（2026-08-16 实证：og 503 → ds 直连 1ms 内切换，成本翻倍
除账单外零信号）。**本文件表达不了这条通道差异**：[[models]] 的 cli_model 只有一个字段，两个通道的
真实模型名不同（opencode-go 侧 `deepseek-v4-flash` / 直连侧 `deepseek-v4-flash-direct`），这儿只能记
主通道的。将来充值后切直连派工时，在 launch 模板/派工参数里显式写 `-direct` 模型名（NEW-MACHINE §6），
别指望本文件帮你变。止血本身的验证手段 = scripts/watchdog.mjs 的 model-change 检测（#569 ②）。
"""

[providers.grok]
cli = "grok"
launch = "grok -m {model} --effort xhigh --always-approve"
launch_model = "grok-4.6"
# grok TUI 把 terminal send 当用户消息再跑命令，8s 探针等不到真执行标记（#499/#502 实测）。
probe_wait_ms = 45000
launch_note = """
grok 单统一走 Grok Build（X 系官方），pi-grok 已退役（拍板 2026-08-14，issue #443）。
2026-08-15 起经 regrok shim（~/.local/bin，覆盖 PATH）已是普通 agent，`--agent grok` 直接可用。
shim 全文、装机三条与启动坑见 NEW-MACHINE.md「grok 怎么配」节——真相源只在那一处，别在此复制。
日常启动模板见本表 launch（terminal create 用）。

**默认起法（2026-08-17 帅实测订正）**：`--effort xhigh --always-approve`。
`--permission-mode auto` ≠ 免确认框，两者不是一回事。#573 当晚 launch 用了前者，帅用同一条起工人：每执行一次外部命令就弹一次 3 选 1（git push / gh api PATCH / gh-as pr comment 各卡一次），每次都要帅手工放行；Ctrl+O 打开 always-approve 才不卡。`--always-approve` 是 grok --help 里的独立参数，才是用户要的「auto」。
每弹一次框就是帅被叫醒一次，正是要消灭的「帅退不出闭环」。
git push 仍会被宿主硬拦，授权词还是往终端回「推」——那是对外发布闸，和 TUI 确认框不是一层。
"""
why = "pi 的 xai provider 走公网 api.x.ai + auth.x.ai 刷 OAuth，整链依赖本机 clash，暴露面大，点将台盲考两次断线死亡（Connection error / terminated）；官方 Grok Build 走专用端点 cli-chat-proxy.grok.com（带客户端头、给免费额度），稳定且会员边际成本≈0。"
note = "授权词「推」（push 硬拦的放行方式）与代理前缀细节见 NEW-MACHINE §7 与 dispatch skill，别在此复制。"
decided = "2026-08-14"

[providers.gpt]
cli = "codex"
default_model = "gpt-5.6-sol"
launch = "codex --dangerously-bypass-approvals-and-sandbox -m {model}"
launch_model = "gpt-5.6-sol"
# 2026-08-16 本树实测：验开工 1.7s，第一项写探针 84s（MCP 还在初始化），后两项 19s/25s。
# 8s 必失败。120s = 84s + 余量。
probe_wait_ms = 120000
launch_note = """
默认模型 gpt-5.6-sol。token 消耗约 3 倍，比价按每件活总成本算，不按单价。

起法（2026-08-15 进程命令行对照实测）：
- 首选 orca 原生 `--agent codex`（参数由 orca 管，不复制可能过期的值）。
- 已存在树里只能 terminal create 时：`codex --dangerously-bypass-approvals-and-sandbox`（与 orca 原生一致）。
- 库默认走第二条，因为帅遇到的都是树已存在。
- 反例：手打 `codex -a never` 把 gh/node/组合命令全拦死；orca 原生三条全过。

三层机制（缺一层就查错方向）：
1. policy 白名单：`~/.codex/rules/default.rules` 是历史上逐条批准过的 prefix_rule。
2. approval 与 sandbox 是正交两维：`-a` 管「不能做的要不要问」，`--sandbox` 管「能做什么」。
3. `-a never` 的真实语义 = 不在白名单就直接拒（因为不能问）。所以 `-a never` 单用比不给还严。

走过的弯路：先以为是 project trust，再以为是 sandbox 档位；分水岭是第 2 条。
"""

[providers.commandcode]
cli = "command-code"
launch = "command-code -m {model} --skip-onboarding --yolo"
launch_model = "deepseek/deepseek-v4-flash"
# 2026-08-16 帅实测：命令发出后需补一记空回车才执行（与 pi/grok 同坑），之后约 20 秒内 TUI 就绪。45s = 20s + 余量。
probe_wait_ms = 45000
launch_note = """
Command Code 官方 CLI，本仓用途 = **非交互查证/测速**（2026-08-16 帅·A 裁定：当前不能承载需进 git 的 Orca 工人，Orca agent 识别清单不含它，`worker-start --terminal` 必返回 `agent_unconfigured`；需进 git 的活走 pi/codex/claude 在册通道）。
模型 id 两段式 `deepseek/deepseek-v4-flash`（-m 直传）。可执行文件是 `cmdc`（`command-code` 也可用），
不是 `cmd`（撞 Windows cmd.exe）。装机与登录见 NEW-MACHINE.md「command-code 怎么配」节。
启动坑（2026-08-16 帅实测）：
- 登录必须真 TTY（Ink raw mode），无 TTY 报 "Raw mode is not supported"；登录只能用户跑 `command-code login`。
- 自动化一律 `--skip-onboarding`，否则撞 onboarding 会静默挂住（同 #500 型坑）。
- 无人值守开关三档（事实记录，2026-08-16 帅·A；launch 模板默认 `--yolo`，**不改默认值**）：`--yolo`（= `--dangerously-skip-permissions`）绕过**所有**权限提示；`--auto-accept` 只是以 auto-accept 模式启动，危险操作**仍可能提示**；`--permission-mode <standard|plan|auto-accept>` 显式设档。实测现象：默认 `--yolo` 会被 Orca classifier 拦截（2026-08-16 帅·A 观察）。此项只作事实记录、不作决策；真要更保守时把 launch 里的 `--yolo` 换成 `--auto-accept` 即可（本文件一处改）。
- 命令发出后需补一记空回车才执行；之后约 20 秒内 TUI 就绪（屏面 `# Command Code` / 输入框 `❯ Ask your question...`）。
- 非交互契约：`-p "问" --max-turns N --skip-onboarding` 输出纯文本、退出码 0；`--output-format json` 出 NDJSON 事件流 + 末尾 result 行。

覆盖面与速度（2026-08-16 帅·A 本机实测）：
- **GOAT 档（$10/月）覆盖面只有开源模型**：`claude-opus-5` / `claude-sonnet-5` / `gpt-5.6-sol` 一律返回 `MODEL_NOT_IN_PLAN`（提示需 Pro 及以上档位）。早先「一个会员覆盖 Claude+GPT+DeepSeek」的说法是错的，已撤回。
- `google/gemini-3.7-flash` 不可用：403 "This model is not available in your region."——Gemini 全系在本机走不通，别写进候选。
- 同一道题（「写 Python 回文判断函数」，`command-code -p ... --max-turns 1 --skip-onboarding`，含 CLI 启动）实测速度：

  模型                         耗时
  zai-org/GLM-5.2              5.9s
  deepseek/deepseek-v4-flash   5.5s
  moonshotai/Kimi-K3           8.3s
  deepseek/deepseek-v4-pro     11.9s
  zai-org/GLM-5.3              14.6s

- 对「审查换厂商」的意义（候选记录，2026-08-16 帅·A）：GOAT 内可用的异厂商选项是 `moonshotai/Kimi-K3` 与 `zai-org/GLM-5.2` / `GLM-5.3`（Claude/GPT 都不在 plan 内）。**只作候选记录，未改 [[rules]] 审官选型序、未动 [[bans]]**——换审官人选要用户拍板，本文件不越权。

pi 接不上 commandcode 的根因（2026-08-16 帅·A 实测，不是 key 的问题）：
- Provider API 协议通：`https://api.commandcode.ai/provider/v1/chat/completions`（OpenAI 兼容）与 `/messages`（Anthropic 兼容）实测可用，`Authorization: Bearer <key>`，模型列表在 `/provider/v1/models`（55 个）。
- 但 pi 的 provider 是**代码里注册**的，不是配置里声明的：往 `~/.pi/agent/models-store.json` 凭空写一个 `commandcode` provider 会被静默忽略，`pi auth check --provider commandcode` 返回 `{"status":"not_ready","reason":"provider_not_found"}`，`pi --list-models` 也不列出。
- 所以「拿到 apikey 就能在 pi 里用」这个前提**不成立**；要在 pi 里用的唯一路是写 provider 插件，而插件方案 2026-08-16 已拍板不采用。**pi 保持 DeepSeek 官方 API 原通道。**
"""
why = "用户 2026-08-16 购买 Command Code 会员（$10/月 GOAT 档），用于**非交互查证/测速**：同一道题实测 5.5s（deepseek-v4-flash）出结果，官方 CLI 断链会明确报错（vs 社区插件可能静默退回默认 provider）。当前不能承载需进 git 的 Orca 工人（2026-08-16 帅·A 裁定：Orca agent 识别清单不含它，worker-start --terminal 必返回 agent_unconfigured）。GOAT 覆盖面只有开源模型（Claude/GPT 全系 MODEL_NOT_IN_PLAN），Gemini 本机不可用（2026-08-16 帅·A 实测）。"
decided = "2026-08-16"

[providers.claude]
cli = "reclaude"
launch = "reclaude --model {model}"
launch_model = "opus"
launch_note = """
裸 claude 会 login rejected（凭据挂在 reclaude 链上）；启动有一段配置同步期，抢跑注入必被吞。
派工一律 `reclaude --model opus`（Fable 只留帅位，派工须用户点名；拍板 2026-08-14，issue #443）。
`--agent` 起不了 reclaude 链（已知 agent 枚举以 `orca worktree create --help` 为准，会漂）——Claude 族终端必须 `orca terminal create --command` 读本表 launch。
"""

[providers.opencode-go]
cli = "pi"
launch = "pi --provider opencode-go --model {model}"
launch_model = "deepseek-v4-flash"
launch_note = """
opencode Go 订阅（2026-08-16 接入）。凭据在 ~/.pi/agent/auth.json 的 `opencode-go` 键——
Zen 与 Go 在 pi 里是两个独立 provider（`opencode` / `opencode-go`），共用 OPENCODE_API_KEY 环境变量，
键填成 `opencode` 会路由到 Zen，Go 额度用不上。

**ds-flash/pro 是同一个模型的两条通道，不是两个模型**（用户拍板 2026-08-16：「没区别，算法记录要互通」）。
所以模型条目只有一条、id 不带通道前缀，战绩天然记在一处；通道信息在 provider + cli_model 上。
通道规则唯一落点见本节 why。

额度是账户级共享硬顶（美元额度制，按各模型单价折算），撞顶后 pi 当场报错。
**[[routes]] 的 fallback 只在选型时主选被门闩剔除才生效，救不了运行时额度耗尽**——额度耗尽的处置见本节 why。
限额与折算价见 https://opencode.ai/docs/go/ 与账号控制台，本文件不复制会过期的数字。
"""
why = """
opencode-go 是 ds-flash/pro 的唯一日常通道（用户 2026-08-16 追加拍板，本字段为通道规则唯一权威落点）：
**deepseek flash/pro 不分峰谷一律走本节（opencode-go）**，[providers.deepseek] 直连只在用户拍板时启用——
撞额度顶后必须报给用户，由用户在「等恢复 / 充值 / 换模型 / 停单 / 手动切直连」之间决定，**AI 不得自行切换通道**。
判例（2026-08-16 og 402 成本跃迁）：og 撞顶报 402 后，擅自先切 ds 直连、再换 claude-opus，成本从 ¥0.05 级
跃到 $10 级——「AI 自行切换」的代价样本，故立此规。
与直连 deepseek 是同一模型、能力相同、无质量风险，额度池比按量便宜（官方口径 $10/月买 6 倍价值额度）。
"""
decided = "2026-08-16"

